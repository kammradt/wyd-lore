# Title, summary and tags used when build_wiki.rb first creates each page, keyed by category/slug.
# After a page exists, edit its YAML header instead; this file only seeds new builds.
lore/historia-de-kersef:
  title: História
  summary: 'Um ancião narra o mito da criação de WYD: os seres supremos Yetzirah e Tzfah criam o mundo e a humanidade, e depois os deuses Kafma, Armia, Daleth, Samech e Haden. O texto passa pela Batalha Celestial, a destruição da ponte Sephira, a Guerra Continental liderada pelo mago Nershess e o mundo 400 anos depois, onde o poder do Arch sobrevive apenas como lenda.'
  tags:
  - lore
  - historia
  - yetzirah
  - tzfah
  - deuses
  - batalha-celestial
historia/with-your-destiny:
  title: With Your Destiny
  summary: Visão geral do With Your Destiny (WYD), MMORPG gratuito desenvolvido pela JoyImpact e lançado em maio de 2003, que tem a Raid Hut como única publicadora global oficial desde fevereiro de 2019. Resume a história dos seres supremos Yetzirah e Tzfah e dos reinos rivais Hekalotia e Akeronia no continente de Kersef, além dos modos de guerra, das quatro classes e dos principais sistemas.
  tags:
  - historia
  - visao-geral
  - publicadora
  - joyimpact
  - raid-hut
  - jogabilidade
classes/personagens:
  title: Personagens e Primeiras Impressões
  summary: Apresenta as quatro classes (Transknight, Foema, Beastmaster e Huntress) e suas várias linhagens de skills. Também explica o início na cidade de Armia, o Campo de Treinamento para personagens de nível 1 e os controles básicos do mouse para andar e atacar.
  tags:
  - classes
  - iniciante
  - armia
  - transknight
  - foema
  - controles
classes/skills:
  title: Skills
  summary: 'Explica como aprender skills com o mestre de cada classe em Armia: Capitão Cavaleiros para TransKnight, Mestre Archi para Beastmaster, Foema Anciã para Foema e ForeLearne para Huntress. Descreve as três linhagens de skill de cada classe, o limite de 24 skills, os pontos de aprendizado, o Aprender Arma e o uso da barra de atalhos.'
  tags:
  - skills
  - classes
  - linhagem
  - npc-mestre-de-skill
  - armia
classes/nona-skill:
  title: Nona Skill (9th)
  summary: Lista as 9ª skills de cada classe, compradas no NPC 9thMaster em Armia e aprendidas a partir do nível 201 por personagens Celestial e Sub-Celestial por 255 pontos de skill. Só é possível aprender a 9ª da mesma linhagem da 8ª; ela eleva o limite de maestria para 320 e pode ser desaprendida com o Círculo Divino Composto.
  tags:
  - skills
  - nona-skill
  - celestial
  - npc-9thmaster
  - classes
classes/decima-skill:
  title: 10ª Skill
  summary: Descreve a 10ª skill de cada linhagem das classes Foema, TransKnight, BeastMaster e Huntress, como Proteção Absoluta e Invocação Final. Para aprender é preciso ter todas as skills anteriores e 4000 pontos de fama.
  tags:
  - skills
  - decima-skill
  - fama
  - classes
classes/decima-primeira-skill:
  title: 11ª Skills
  summary: Lista o livro da 11ª skill de cada linhagem, como Blaze Launcher, Life Wave Book e Bleeding Book, com seus efeitos. Para aprender é preciso nível 281 ou superior, 8.000 pontos de fama e o livro da skill.
  tags:
  - skills
  - decima-primeira-skill
  - livros-de-skill
  - fama
  - classes
classes/decima-segunda-skill:
  title: 12ª Skills
  summary: Lista as 12ª skills de todas as linhagens, aprendidas por personagens Celestial acima do nível 320 com o NPC Jazeg em Armia. A 11ª skill da mesma linhagem é pré-requisito, e o custo é de 12.000 de fama (reduzido inicialmente para 1.200 durante os testes).
  tags:
  - skills
  - decima-segunda-skill
  - celestial
  - npc-jazeg
  - classes
classes/mudanca-de-classe:
  title: Mudança de Classe e Mudança de Corpo
  summary: Explica como trocar a classe do personagem pelo NPC Wooreunammu em Kefra (Sephirot da classe desejada mais 100kk) ou com o item Sephiroth Blessing, que desaprende todas as skills Sephira. A mudança de corpo usa o item Sephiroth Protection, e ambos os itens vêm dos eventos mensais do servidor Global.
  tags:
  - classes
  - mudanca-de-classe
  - sephirot
  - npc-wooreunammu
  - kefra
progressao/guia-para-novatos:
  title: Guia para Novatos
  summary: 'Guia para iniciantes no WYD Global: o canal verde de novatos, a definição da senha numérica, a escolha de uma das quatro classes e a quest inicial do Campo de Treinamento. Nela, o jogador fala com os NPCs Unicornio e CabuncleWyd e derrota o boss Orc para obter o emblema do Orc; o guia também explica a interface e as teclas de atalho.'
  tags:
  - iniciante
  - guia
  - campo-de-treinamento
  - interface
  - classes
progressao/arch:
  title: Arch
  summary: Explica a classe Arch, liberada ao concluir as quests A procura da vida eterna e Um novo começo, que cria um segundo personagem com o mesmo nome. Aborda as restrições de equipamento do Arch (sem elmos, armas classe E ou Lydians), os bônus obtidos no nível 370 e o ganho de atributos por nível de cada classe.
  tags:
  - arch
  - progressao
  - classes
  - atributos
  - quest
progressao/criacao-do-celestial:
  title: Criação do Celestial
  summary: Explica como criar um Celestial, o que exige um mortal nível 400, um Arch de pelo menos nível 356, as quatro pedras secretas, a Saphirot da classe e a Pedra da Imortalidade. O Odin em Kefra cuida das pedras secretas, e a Ehre em Erion configura a skill Limite da Alma (Soul) com combinações de joias.
  tags:
  - celestial
  - progressao
  - npc-odin
  - soul
  - cythera
progressao/desbloqueio-level-40-celestial:
  title: Desbloqueio do Level 40 - Celestial
  summary: Explica como desbloquear o limite de nível 40 do Celestial entregando ao NPC Odin as runas Fehu, Mannaz, Thuirisaz e Ansuz, nessa ordem, junto com 2 pergaminhos selados e um selo mágico.
  tags:
  - celestial
  - desbloqueio-de-level
  - runas
  - npc-odin
  - progressao
progressao/desbloqueio-level-90-celestial:
  title: Desbloqueio do Level 90 - Celestial
  summary: Explica como desbloquear o limite de nível 90 do Celestial. As runas Sowilo, Kenaz, Uraz, Thurisaz, Isa, Tiwaz e Hagalaz são entregues em ordem ao NPC Odin, com 2.000.000 de gold, para criar a Pedra da Fúria, que pode falhar ao ser usada.
  tags:
  - celestial
  - desbloqueio-de-level
  - runas
  - npc-odin
  - pedra-da-furia
progressao/reset-celestial-level-200:
  title: Reset Celestial Level 200
  summary: Depois de criar a Cythera Arcana no nível 200, Celestiais e Sub-Celestiais podem resetar até 3 vezes, ganhando 160 pontos a cada vez. Cada reset exige nível 200+ (4 bilhões de experiência), 1000 de fama e uma Pedra da Fúria, e consome 50 milhões de experiência.
  tags:
  - celestial
  - reset
  - progressao
  - pedra-da-furia
  - sub-celestial
progressao/desbloqueio-level-240-a-360-celestial:
  title: Desbloqueio Nível 240 a 360 - Celestial
  summary: Explica o desbloqueio dos níveis 240, 280, 320 e 360 do Celestial com o item Proteção Divina, composto no NPC Dedekinto em Kefra a partir de 2 Coração Beriel Amald e 2 Alma Beriel (25% de sucesso). O desbloqueio do 240 nunca falha; a partir do 280, os dois personagens precisam estar no mesmo nível e há 50% de chance de falha.
  tags:
  - celestial
  - desbloqueio-de-level
  - npc-dedekinto
  - kefra
  - progressao
progressao/sub-celestial:
  title: Sub Celestial
  summary: Explica como criar um Sub-Celestial a partir de um Celestial nível 120+ usando 100 de fama, uma Sephirot da classe escolhida e uma Pedra Ideal, e como alternar entre os dois com a Pedra Misteriosa, feita no NPC Ehre em Erion. Aborda os bônus de Cythera que o personagem principal recebe pelo nível do Sub e lembra que o Sub precisa reaprender todas as skills Sephira.
  tags:
  - sub-celestial
  - celestial
  - progressao
  - npc-ehre
  - cythera
progressao/cythera-arcana:
  title: Cythera Arcana
  summary: Explica como criar a Cythera Arcana (A), a tiara de nível mais alto, com um Celestial ou Sub-Celestial nível 200+, as quatro pedras secretas, uma Pedra da Fúria, uma Cythera M +11 e 1000 de fama, com 50% de chance de sucesso. Também explica como recriá-la no NPC Arcane Jeweler em Kefra a partir do nível 241, o que custa 2 de cada pedra secreta, 2 Pedras da Fúria, 4 emblemas Valkyria e 100kk de gold.
  tags:
  - cythera
  - celestial
  - composicao
  - npc-arcane-jeweler
  - kefra
quests/campo-de-treinamento:
  title: Campo de Treinamento
  summary: Quest para iniciantes dos níveis 1 a 35 no campo de treinamento a leste de Armia, dividido em quatro áreas cujos bosses (GremlinDecoy, GiantCrill, OrcSniper, OrcWarrior) dropam as chaves para o próximo portão. Os NPCs treinadores (FirstTrainer, SecondTrainer, ThirdTrainer, TrainerChief) dão poções de cura, adicionais aleatórios em armas, refinação até +6 e o item de experiência Olho Crescente, uma vez por personagem.
  tags:
  - quest
  - iniciante
  - armia
  - campo-de-treinamento
  - npc-trainerchief
quests/defensor-da-alma:
  title: Defensor da Alma
  summary: Quest repetível de upar para os níveis 40 a 115 no cemitério de Armia, com entrada pelo NPC Gravekeeper, onde os jogadores enfrentam monstros que tentariam reviver o General da Morte. Os monstros dropam a Caixa da Sabedoria, que dá 30.000 de experiência ao ser usada.
  tags:
  - quest
  - upar
  - armia
  - cemiterio
  - npc-gravekeeper
quests/conquista-do-castelo-orc:
  title: Conquista do Castelo Orc
  summary: Quest para os níveis 1 a 400 no Castelo Orc ao norte de Armia, em que se avança pelos portões derrotando OrcKeeper, OrcGuard e CheifOrc para obter as chaves até enfrentar o OrcLord. A recompensa é a Pílula do Poder Mágico, usável uma vez por personagem para ganhar 9 pontos de skill.
  tags:
  - quest
  - castelo-orc
  - armia
  - boss-orclord
  - pontos-de-skill
quests/defensor-da-terra-mistica:
  title: Defensor da Terra Mística
  summary: Quest única para os níveis 60 a 400, iniciada com o NPC KnightsLeader em Azran, em que os jogadores defendem o NPC ExploitLeader dos monstros nas Terras Místicas ao sul de Azran. A recompensa é um amuleto Prata, Ouro ou Místico, conforme o desempenho.
  tags:
  - quest
  - azran
  - terra-mistica
  - escolta
  - amuleto
quests/bencao-de-deus:
  title: Benção de Deus
  summary: Quest única para os níveis 70 a 75 ao norte de Erion, iniciada com o Zesty Priest, em que os jogadores caçam o boss NainTrollChief para obter a relíquia Pedaço da Chance e levá-la ao sacerdote Kruno. Kruno a transforma em um Composto de Chance, que reseta 50 pontos de skills e aprendizado e não pode ser usado por personagens Arch.
  tags:
  - quest
  - reset-de-skill
  - erion
  - npc-kruno
  - boss-nain-troll-chief
quests/formatura-de-cavaleiros-aprendizes:
  title: Formatura de Cavaleiros Aprendizes
  summary: Quest única para os níveis 101 a 150 no Campo de Treinamento dos Cavaleiros ao sul de Azran, iniciada com o NPC TS Chief. Os jogadores derrotam o TaursKing para obter o Emblema da Aprendizagem e o apresentam ao TS Leader para receber a capa Manto do Aprendiz.
  tags:
  - quest
  - azran
  - capa
  - boss-taursking
  - npc-ts-leader
quests/jardim-de-deus:
  title: Jardim de Deus
  summary: Quest repetível de upar para os níveis 116 a 190 no Jardim de Deus ao sul de Azran, com entrada pelo NPC Gardener. Os monstros de lá dropam a Lágrima Angelical, que dá 120.000 de experiência ao ser usada.
  tags:
  - quest
  - upar
  - azran
  - jardim-de-deus
  - npc-gardener
quests/equilibrio-da-forca:
  title: Equilíbrio da Força
  summary: Quest única para os níveis 120 a 125 ao sul de Azran, ligada à catedral de Achro e à sacerdotisa Amelia, que mantém o equilíbrio entre Akelonia e Hekalotia. Os jogadores derrotam o InionTrollChief para obter o Pedaço de Equilíbrio e recebem o Composto de Equilíbrio, que reseta 100 pontos de aprendizado de skill.
  tags:
  - quest
  - reset-de-skill
  - azran
  - npc-amelia
  - boss-inion-troll-chief
quests/ressurreicao-do-cavaleiro-negro:
  title: Ressurreição do Cavaleiro Negro
  summary: Quest repetível de upar para os níveis 191 a 265 no primeiro andar da Dungeon, onde o túmulo de Kaizen foi profanado e Kaizen foi revivido pelo Esqueleto Consery. Com entrada pelo NPC Scout, dá como recompensa o Coração de Kaizen, que vale 250.000 de experiência.
  tags:
  - quest
  - upar
  - dungeon
  - kaizen
  - npc-scout
quests/molar-do-gargula:
  title: Molar do Gárgula
  summary: Quest para os níveis 201 a 255 no primeiro andar da Dungeon, com acesso pelo NPC Scout, em que os jogadores caçam o GagoilChief para obter o raro Molar do Gárgula. O item, de uso único, refina a armadura equipada para +6.
  tags:
  - quest
  - dungeon
  - refinacao
  - boss-gagoil-chief
  - npc-scout
quests/cavaleiro-do-reino:
  title: Cavaleiro do Reino
  summary: Quest única para os níveis 220 a 250 no centro dos reinos, iniciada com um RoyalGuard, em que os jogadores derrotam o DarkKnightKing para obter o Emblema do Reino. Jurar lealdade ao KingGlantuar (Vermelho) ou ao KingHarabard (Azul) concede o Manto Akelonia ou o Manto Hekalotia, respectivamente.
  tags:
  - quest
  - reino
  - capa
  - akelonia
  - hekalotia
  - boss-dark-knight-king
quests/hidra-imortal:
  title: Hidra Imortal
  summary: Quest repetível de upar para os níveis 266 a 320 no primeiro andar da Dungeon, onde as Hidras foram corrompidas pelo Olho de Sangue e presas ao antigo mal de Haden. Com entrada pelo NPC Scout, dá como recompensa o Olho de Sangue, que vale 500.000 de experiência.
  tags:
  - quest
  - upar
  - dungeon
  - hidra
  - haden
  - npc-scout
quests/inicio-da-infelicidade:
  title: Início da Infelicidade
  summary: Quest repetível de upar para os níveis 321 a 355 no primeiro andar do Submundo, ligada aos Elfos exilados que se tornaram Elfos Negros pelo poder de Haden. Com entrada pelo NPC Guard, dá como recompensa a Pedra Espiritual dos Elfos, que vale 800.000 de experiência.
  tags:
  - quest
  - upar
  - submundo
  - elfos-negros
  - haden
  - npc-guard
quests/desbloqueio-de-capa-355:
  title: Desbloqueio de Capa 355
  summary: Quest para os níveis 355 a 400 concluída ao usar o Selo do Guerreiro, obtido de outros jogadores ou com o NPC Farche em Erion. Usar o selo transforma a capa do jogador em Elite de Akelonia (Vermelho) ou Elite de Hekalotia (Azul).
  tags:
  - quest
  - capa
  - level-355
  - npc-farche
  - reino
quests/rastros-do-mundo-celestial:
  title: À Procura dos Rastros do Mundo Celestial
  summary: Quest especial sobre sete cristais que restaram da Guerra Celestial e são dropados por monstros nos arredores de Armia. Levar os sete (Cristal I a VII) ao Dragão Dourado em Armia aplica um novo atributo aleatório a uma arma não Arch refinada +10 ou mais, ou a uma arma Ancient.
  tags:
  - quest
  - guerra-celestial
  - cristais
  - armia
  - atributos-de-arma
quests/contrato-dos-espiritos:
  title: Contrato dos Espíritos
  summary: Quest única em quatro fases para personagens Arch nível 355 com mais de 1.950.000.000 de experiência, usando itens caçados na Dungeon Kefra. Cada fase concluída custa 100 milhões de experiência e aumenta os valores de habilidade.
  tags:
  - quest
  - arch
  - kefra
  - level-355
  - progressao
quests/rainha-valquiria:
  title: Rainha Valquíria
  summary: Quest exclusiva para Celestiais e feita em grupo, com quatro etapas e cronômetro de 15 minutos, que começa matando o IceQueen Mirror em Nipleheim e continua no Castelo de Gelo contra monstros invocados e a Sombra Negra. O boss final, Ice Queen Verid, sempre dropa o Coração do Beriel e mais uma recompensa extra, como Alma do Beriel ou Refinação Abençoada +1.
  tags:
  - quest
  - celestial
  - grupo
  - nippleheim
  - boss-ice-queen-verid
quests/cacador-de-espolios:
  title: Caçador de Espólios
  summary: Quest diária de caça que exige o Mercenary Coupon e um traje Normal Hunter Costume ou Mystic Hunter Costume, com entregas por horário aos NPCs HuntMaster/LootMaster ou Huntsman/Lootsman. As recompensas são Rubis, gastos no NPC RubiMaster, e baús Tesouro Perdido, abertos no PirateMaster.
  tags:
  - quest
  - diaria
  - rubis
  - npc-rubimaster
  - caca
quests/irmaos-nordicos:
  title: Irmãos Nórdicos
  summary: Apresenta os irmãos artesãos Hoder, que adiciona um atributo extra às Cytheras Bahamut e Amunra, e Balder, que tenta refinar as capas de personagens Celestiais de +9 até +13. Os dois NPCs ficam dentro do mapa da quest Zona Infernal.
  tags:
  - quest
  - npc-hoder
  - npc-balder
  - cythera
  - celestial
  - refinacao-de-capa
mapas/armia:
  title: Armia
  summary: Guia do mapa de Armia, a cidade murada onde todo novo personagem de WYD começa, com seus NPCs, como Martin, Galford, o Dragão Dourado, Premium Neil, o Guarda Carga e os mestres de skill das classes. Também mostra a zona de guilda, a zona PvP, os teleportes para Noatun e para as dungeons e o campo de treinamento.
  tags:
  - cidade
  - area-inicial
  - npcs
  - mapa
mapas/nippleheim:
  title: Nippleheim
  summary: Mapa e lore de Nippleheim, a terra congelada ao norte de Azran para onde Tzfah e seu braço direito Neses foram exilados após a Guerra Celestial, e onde foi construída a base do Comando Karden para combater os elfos negros. Lista os NPCs locais, como July, Shany, Tiny, Martin e Premium Neil.
  tags:
  - mapa
  - lore
  - terra-congelada
  - npcs
  - elfos-negros
mapas/submundo:
  title: Submundo
  summary: Lore do Submundo, nascido da guerra entre os reinos de Hekalotia e Akelonia pelo minério celestial 'Temuh'. A área se divide na Dungeon de Nikirr (primeiro nível) e no Submundo (segundo nível), além do Rio da Morte, com monstros do tipo demônio que ficam mais fortes quanto mais fundo se vai.
  tags:
  - dungeon
  - lore
  - mapa
  - demonios
mapas/dungeon-kefra:
  title: Dungeon Kefra
  summary: Apresenta o mapa da Dungeon Kefra, sua lore sobre a disputa pela Coroa de Athila e o Deserto de Kult, e a luta semanal contra o boss Kefra no Hall de Kefra, acessado entregando um Pergaminho Selado ao NPC Sobrevivente. Derrotar Kefra abre no canal novato um portal para o Continente Desconhecido, onde ficam o Alquimista Odin e o Uxmal; entre os drops estão a Pedra da Imortalidade e as Sephirots.
  tags:
  - dungeon
  - boss
  - kefra
  - lore
  - drops
mapas/dragon-field:
  title: Dragon Field
  summary: Mapa acessado pelo NPC Gold Dragon em Azran com o item Dragon Guardian equipado (feito a partir de uma Dragon Soul no Dragon Elder). A Parte 1 é protegida pelo boss Legend Verid, que dropa o Mark of Archangel, e a Parte 2 pelos bosses Nesses e Haden, que podem desbloquear o nível 360 para personagens celestiais.
  tags:
  - mapa
  - boss
  - celestial
  - end-game
  - dragao
mapas/deserto-desconhecido:
  title: Deserto Desconhecido
  summary: Mapa acessado pelo NPC Angela Sister em Noatun, no canal novato, entregando um Artefato Ancestral; ele reinicia a cada 20 minutos. Dropa Shiny Laktorerium pieces e a Dragon Soul usada para chegar ao Dragon Field, com monstros como BoneDragon, Scorpion e Fire Gagoil.
  tags:
  - mapa
  - deserto
  - drops
  - dragon-soul
mapas/zona-infernal:
  title: Zona Infernal
  summary: Quest diária em grupo às 22:00 e 22:30 para até 52 jogadores, com entrada pelo ticket Gate of Hell e dividida em seis fases de bosses e Lichs. Termina com a proteção do NPC Dionys em troca de muita experiência; HellLich e ArchLich dropam itens como Infinity Symbols, Moonstone e Jewel of Darkness.
  tags:
  - quest
  - grupo
  - experiencia
  - lich
  - drops
mapas/pesadelo-a:
  title: Pesadelo A
  summary: Quest de upar em grupo para personagens Arch de nível alto e celestiais, passada em Azran, em que o grupo protege 8 NPCs da cidade por 15 minutos. A entrada é possível em XX:10, XX:30 e XX:50, e os inimigos incluem Taron, Iron Taron, Hell Spider, Manticora e Lugefer.
  tags:
  - quest
  - experiencia
  - grupo
  - arch
  - celestial
mapas/pista-de-runas:
  title: Pista de Runas
  summary: Quest em grupo composta a partir de sete poeiras de Lactolerium no Alquimista Odin e registrada com o NPC Uxmal no Hall de Kefra, que dá runas, drops, experiência e a refinação abençoada. Tem sete etapas, de +0 a +6 (Lich, Torre, Amon, Lobo, Labirinto, Barlog, Coelho), cada uma com seu objetivo e suas runas de recompensa.
  tags:
  - quest
  - runas
  - grupo
  - kefra
  - refinacao
mapas/coliseu:
  title: Coliseu
  summary: Quest diária de drop com PvP na arena a leste de Azran, nos servidores novatos, com entrada pelo item Notificação Pública. Acontece em três níveis às 19:00, 20:00 e 21:00, os dois primeiros apenas para Mortais e Archs, e dropa cristais, restos e poeiras de Ori e Lac.
  tags:
  - quest
  - pvp
  - arena
  - drops
itens/armas-ancient:
  title: Armas Ancient
  summary: Explica como combinar uma arma +9 com uma gema Diamante, Esmeralda, Coral ou Granada no NPC Compositor, em Azran, para criar uma arma Ancient com um atributo extra. Itens opcionais de +7 a +10 aumentam a chance de sucesso, e todos os itens são perdidos em caso de falha.
  tags:
  - armas
  - ancient
  - composicao
  - gemas
itens/adicional-arma-arch:
  title: Passando Adicional para Arma Arch
  summary: Guia rápido para transferir um adicional (add) para uma arma Arch no NPC Tainy, em Karden, usando a arma Ancient +9 de destino, uma arma Ancient +9 com o add desejado, um item +9 [D] ou [E] e 100.000.000 de gold. O processo pode falhar.
  tags:
  - armas
  - arch
  - ancient
  - adicional
  - composicao
itens/barra-de-mithril:
  title: Barra de Mithril
  summary: Guia das Barras de Mithril, que melhoram os adicionais de armas e armaduras Arch e celestiais refinadas a pelo menos +11, nas classes Ataque Mágico, Dano, Crítico, Defesa e Imunidade. Lista o add máximo por classe e slot de equipamento e o limite abaixo do qual as barras não reduzem mais o add.
  tags:
  - mithril
  - refinacao
  - arch
  - celestial
  - equipamentos
itens/armaduras-celestiais:
  title: Criação e Refinação de Armaduras Celestiais
  summary: 'Guia de criação de armas e armaduras celestiais: os itens selados são compostos nos NPCs InfWeapon e InfArmor, perto do dragão de Azran, refinados até +9 com poeira de Lac e combinados com o Alquimista Odin, na cidade perdida de Kefra, usando uma peça Arch +15, uma pedra lunar e pedras secretas. Também explica o uso da pedra lunar e da joia da escuridão.'
  tags:
  - celestial
  - armaduras
  - refinacao
  - composicao
  - armas
itens/cintos:
  title: Composição de Cintos
  summary: Mostra como compor cintos tier 1 e tier 2 no NPC MystWizard usando Simbolos da Sabedoria, Royal Coupon e, no tier 2, dois cintos tier 1 iguais. A composição não tem chance de falha e os cintos obtidos são imóveis.
  tags:
  - cintos
  - composicao
  - equipamentos
  - npc-mystwizard
itens/mount-growth-stabilizer:
  title: Mount Growth Stabilizer
  summary: Item usado para refinar núcleos de montaria e facilitar a evolução da montaria, composto em pacotes de 100 no NPC Conjurer Ehre, em Erion, com 5 Selos mágicos, 100 poeiras de Lac e 1kk de gold. A composição nunca falha.
  tags:
  - montaria
  - refinacao
  - composicao
  - npc-ehre
itens/pedras-espirituais:
  title: Pedra Espiritual E e F / Pedra Amunra
  summary: Explica as pedras espirituais classe E e F, que concedem dano perfurante e absorção de dano, sendo a classe F composta no NPC Shany por personagens Arch 356+. Também mostra como definir o adicional base com os Ankhs da Justiça, da Eternidade e da Glória no Ehre, em Erion, e informa que as pedras Amunra seguem as mesmas regras.
  tags:
  - pedras-espirituais
  - amunra
  - composicao
  - refinacao
  - arch
itens/essence-of-gods:
  title: Refinação de Essence of Gods
  summary: Explica a refinação da Essence of Gods no NPC Conjurer Ehre, em Erion, com poeira de Lac 100, poeira de Lac, um Bless Stabilizer e 1kk de gold. Apenas personagens celestiais de level 320 ou superior podem tentar, e a falha destrói tudo, exceto a Essence.
  tags:
  - essence-of-gods
  - refinacao
  - celestial
  - composicao
itens/capas:
  title: Capas
  summary: 'Guia das capas de reino, que definem o reino do personagem: mortais conseguem a capa vermelha ou azul pela Quest Cavaleiro do Reino a partir do level 220 ou levando safiras ao Rei acima do level 250. Também aborda a troca de reino com o Peerage Lift, as bordas das capas nos levels 255 e 355 e as capas de personagens Arch.'
  tags:
  - capas
  - reino
  - quest
  - safira
  - arch
itens/fadas:
  title: Fadas
  summary: Guia das cinco fadas (azul, verde, vermelha, prateada e dourada), itens de suporte que aumentam o drop e a experiência. A azul, a verde e a vermelha são vendidas pelo Premium Neil, enquanto a prateada e a dourada são feitas a partir da fada vermelha com o Flash prateado do NPC Farche, em Erion, ou o Flash dourado do NPC Mai, e vendem automaticamente os drops não agrupáveis.
  tags:
  - fadas
  - experiencia
  - drop
  - loja-cash
itens/fragmentos-da-alma:
  title: Fragmentos da Alma
  summary: Os Fragmentos da Alma são trocados em lotes de 12 no NPC Alchemy Annie, em Azran, por uma Alma da Fênix ou do Unicórnio aleatória, usada para criar a pedra da imortalidade de personagens Arch, Celestial e Sub Celestial. Eles dropam de RujeperBroken no deserto, LichVatama e LichCrunt em Kefra e no Deserto Desconhecido.
  tags:
  - materiais
  - pedra-da-imortalidade
  - drop
  - arch
  - celestial
itens/pergaminhos-da-agua:
  title: Pergaminhos da Água
  summary: Os Pergaminhos da Água abrem salas de experiência com tempo limitado na caverna da água, perto de Azran, para grupos de pelo menos 8 jogadores. Os pergaminhos Normal e Místico são para mortais e Archs, enquanto o Arcano é exclusivo para celestiais.
  tags:
  - pergaminhos
  - experiencia
  - quest
  - grupo
itens/premium-neil:
  title: Premium Neil (Prisang Neil)
  summary: O Premium Neil é o NPC presente em todas as cidades, ao lado do Guarda de Carga, que vende todos os itens de NP (cash), organizados em abas com os nomes das cidades do jogo. Entre os itens estão fadas, baús de experiência, pedras de troca de nome, Poções Divinas, safiras, Replation e joias para itens Ancient.
  tags:
  - npc
  - premium-neil
  - loja-cash
  - itens
  - fadas
sistemas/interface:
  title: Interface
  summary: Explica os principais elementos da tela do WYD, como as barras de HP, MP e HP da montaria, o mini mapa, a janela de chat, o contador de poções e a barra de experiência, além dos atalhos de teclado.
  tags:
  - interface
  - atalhos
  - iniciante
sistemas/controles:
  title: Controles
  summary: 'Apresenta os controles básicos do jogo: movimentação e ataque com o mouse, uso de skills pela barra de atalhos (1-10 / F1-F10), ativação do ataque automático com a tecla T e compras em NPCs mercadores e no baú.'
  tags:
  - controles
  - combate
  - skills
  - iniciante
  - loja
sistemas/grupo:
  title: Grupo
  summary: Mostra como formar, entrar e sair de um grupo (party) e expulsar membros, além da tabela de bônus de experiência, que vai de 180% com 2 membros até 300% com 8 ou mais.
  tags:
  - grupo
  - party
  - experiencia
  - iniciante
sistemas/modo-cc:
  title: Modo C.C. (Controle de Combate/Macro)
  summary: Explica o Modo C.C., o macro de combate automático que ataca ou usa skills nos monstros ao alcance, ativa os buffs do primeiro slot de atalho e usa poções ou alimenta a montaria automaticamente em porcentagens de HP definidas; ele nunca ataca outros jogadores.
  tags:
  - macro
  - combate-automatico
  - pocoes
  - upar
sistemas/replation:
  title: Replation
  summary: Explica a Pedra Replation, vendida nas classes A a C pela mercadora Lucy em Azran, que muda a classe de armaduras +3 ou menos e adiciona um atributo de classe aleatório em caso de sucesso, mas destrói o item se falhar.
  tags:
  - replation
  - armaduras
  - classe-de-item
  - composicao
sistemas/reinos:
  title: Sistema de Reinos
  summary: Explica a história da divisão entre os reinos Hekalotia e Akelonia, como entrar em um reino a partir do level 220 pagando Safiras ao Rei, como sair dele por 16 Safiras e os benefícios de capa e de experiência no PK para os membros.
  tags:
  - reino
  - lore
  - capas
  - safira
  - pvp
sistemas/pintura:
  title: Sistema de Pintura
  summary: Explica como tingir equipamentos de defesa (não armas nem acessórios) refinando a Tintura com Poeira de Oriharucon para obter o Feijão Mágico, comprado no Premium Neil; só itens +1 ou superiores podem ser pintados.
  tags:
  - pintura
  - tintura
  - visual
  - equipamentos
sistemas/refinacao:
  title: Sistema de Refinação
  summary: Explica a refinação de itens de +0 a +11 com Poeira de Oriharucon e Lactorerium, o caminho das armas Ancient, a composição +10 no NPC Alieen em Azran com gemas de efeito de joia e a composição de +12 a +15 com o Alquimista Odin na cidade de Kefra, com chances fixas de 4% a 1%.
  tags:
  - refinacao
  - equipamentos
  - ancient
  - composicao
sistemas/montarias:
  title: Montaria
  summary: Explica como as montarias crescem de ovo a filhote e depois a montaria, como os Amagos elevam o level da montaria até 120, os bônus que elas dão (velocidade, dano, evasão e absorção) e a necessidade de alimentá-las; os ovos de Grifo Sangrento são exclusivos de personagens Celestiais.
  tags:
  - montaria
  - amagos
  - equipamentos
  - pets
sistemas/evasao:
  title: Evasão
  summary: Guia rápido sobre o atributo evasão, que dá chance de os ataques inimigos errarem, e como aumentá-lo com destreza e certas montarias.
  tags:
  - evasao
  - atributos
  - destreza
  - defesa
sistemas/critico-x4:
  title: Ataque Crítico X4
  summary: 'Explica como a velocidade de ataque permite que personagens físicos multipliquem os acertos críticos: 200% libera o crítico x2, 400% o x3 e 800% o x4, com exemplos de builds e suas chances de multiplicador.'
  tags:
  - critico
  - velocidade-de-ataque
  - combate
  - builds
sistemas/chaos-points:
  title: Chaos Points
  summary: 'Explica o sistema de Chaos Points (CP) do PK, que vai de -75 a +75: matar jogadores reduz o CP, enquanto upar e usar o Pergaminho do Perdão o aumentam. Também aborda o comando /cp e exceções como guerras de guild e áreas de PK nas cidades.'
  tags:
  - chaos-points
  - pk
  - pvp
  - penalidades
sistemas/guild:
  title: Guild
  summary: Explica como criar uma guild por 100 milhões de gold pelo painel O (até 52 membros e 3 sub-líderes), a gestão de membros, a Fame Guild obtida nas guerras de Torre, Cidade e Noatun e em bosses como Kefra e SandLich, a Influência da Guild e a Loja da Guild.
  tags:
  - guild
  - guerra-de-guild
  - fame
  - comunidade
pvp/guerra-de-reinos:
  title: Guerra de Reinos
  summary: Explica a Guerra de Reinos, que acontece de segunda a sexta, das 22:00 às 22:50, no servidor Novato, com entrada pelo portal de Noatun, onde os jogadores matam jogadores, NPCs e o Rei do reino inimigo para ganhar fame sem perder CP.
  tags:
  - pvp
  - reino
  - guerra
  - fame
  - noatun
pvp/arena-real:
  title: Arena Real
  summary: Apresenta a Arena Real, torneio para personagens Celestiais com inscrição nos NPCs Repus em Armia, Azran e Gelo às 13:00, 19:00, 20:30 e 23:00 para até 52 jogadores, além do modo Torre Infinita, do passe de batalha, dos tiers de ranking e das recompensas do NPC Real Master.
  tags:
  - pvp
  - arena
  - torneio
  - celestial
  - recompensas
npcs/godmaster:
  title: GodMaster
  summary: O NPC GodMaster, em Armia (X:2126 Y:2123), troca livros de skills específicos de cada classe, como a 10ª e a 11ª skill; os livros são vinculados à conta e as compras não podem ser desfeitas.
  tags:
  - npc
  - npc-godmaster
  - skills
  - livros-de-skill
  - armia
npcs/divine-merchant:
  title: DivineMerchant (Victory Coupom)
  summary: O NPC DivineMerchant, em Armia (X:2143 Y:2087), vende itens vinculados à conta em troca de Victory Coupons dropados nas LAN N, M e A, incluindo a Pedra da Imortalidade para criar Arch, Amagos de montaria e a Pedra Ideal (Limitada) para criar Celestial.
  tags:
  - npc
  - loja
  - victory-coupon
  - armia
npcs/9th-master:
  title: 9th Master
  summary: O NPC 9th Master, em Armia (X:2136 Y:2115), fornece o livro da nona skill de cada classe; os livros são vinculados à conta e as compras não podem ser desfeitas.
  tags:
  - npc
  - skills
  - livros-de-skill
  - armia
npcs/jazeg:
  title: Jazeg
  summary: O NPC Jazeg (2117 2081) troca a opção bônus dos itens Amuleto Arcano (HP) e Amuleto Arcano (MP) refinados a +11 ou +15, sem chance de falha.
  tags:
  - npc
  - npc-jazeg
  - acessorios
  - amuleto
  - adicional
npcs/dedekinto:
  title: 'Dedekinto: Criação de Lac 100'
  summary: O NPC Dedekinto compõe uma Poeira de Lac 100 vinculada à conta a partir de 10 Poeiras de Lac e 1 Shiny Laktorerium; todos os materiais são destruídos em caso de falha.
  tags:
  - npc
  - npc-dedekinto
  - composicao
  - lac
  - refinacao
eventos/invasao-noatun-sand-lich:
  title: Invasão a Noatun (Sand Lich)
  summary: Todos os dias às 00:00, Noatun é invadida por monstros IceLich no canal Novato durante 30 minutos; derrotá-los invoca o boss Sand Lich no altar de Thor, que dropa itens raros e dá 25 de Fame Guild à guild que der o último golpe.
  tags:
  - evento
  - boss
  - noatun
  - guild
  - fame
suporte/trocar-nick:
  title: Como trocar o seu nick
  summary: Passo a passo para trocar o nick de um personagem criando um novo personagem com o nome desejado e usando a Pedra da Troca Maior e a Pedra da Troca Menor, compradas no NPC Neil.
  tags:
  - suporte
  - nick
  - conta
  - tutorial
suporte/erro-login-mac:
  title: Como corrigir problema de login pelo MAC
  summary: Explica que falhas de login podem ocorrer quando o endereço MAC do computador coincide com o de outro jogador conectado, e como gerar um MAC aleatório com o programa gratuito Technitium MAC Address Changer.
  tags:
  - suporte
  - login
  - endereco-mac
  - solucao-de-problemas
suporte/quedas-de-conexao:
  title: Correção de quedas de conexão no servidor
  summary: Trata de jogadores desconectados sem motivo por conflito de IP e sugere trocar de rede usando uma VPN como a Windscribe, com um vídeo tutorial.
  tags:
  - suporte
  - conexao
  - vpn
  - solucao-de-problemas
