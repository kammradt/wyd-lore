  title_en: C.C. Mode (Combat Control/Macro)
  summary_en: Explains C.C. Mode, the auto-combat macro that attacks or casts skills on monsters in range, uses buffs from the first quick slot, and drinks potions or feeds the mount automatically at set HP percentages; it never attacks other players.
