systems/refinement:
  title: Sistema de Refinação
  title_en: Refinement System
  summary_en: Covers item refinement from +0 to +11 using Poeira de Oriharucon and Lactorerium, the Ancient weapon path, +10 composition at NPC Alieen in Azran with jewel effect gems, and +12 to +15 composition at Alquimista Odin in Kefra city with fixed success rates of 4% to 1%.
