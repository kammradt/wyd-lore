  - fame
  - noatun
pvp/royal-arena:
  title: Arena Real
  title_en: Royal Arena
  summary_en: Describes the Royal Arena tournament for Celestial characters, with registration at the Repus NPCs in Armia, Azran and Gelo at 13:00, 19:00, 20:30 and 23:00 for up to 52 players, its Infinite Tower mode, battle pass, ranking tiers and Real Master rewards.
  tags:
