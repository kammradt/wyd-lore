systems/controls:
  title: Controles
  title_en: Controls
  summary_en: 'Covers basic game controls: mouse movement and attacks, using skills from the quick slots (1-10 / F1-F10), toggling auto-attack with the T key, and buying from merchant NPCs and the storage.'
