  - defense
systems/critical-attack-x4:
  title: Ataque Crítico X4
  title_en: Critical Attack x4
  summary_en: 'Explains how attack speed lets physical characters multiply critical hits: 200% enables x2, 400% enables x3 and 800% enables x4 criticals, with example builds and their multiplier chances.'
