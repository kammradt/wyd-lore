  title_en: Guild
  summary_en: Covers creating a guild for 100 million gold via the O panel (up to 52 members and 3 sub-leaders), member management, Fame Guild earned from Tower, City and Noatun wars and bosses like Kefra and SandLich, Guild Influence and the Guild Shop.
  tags:
