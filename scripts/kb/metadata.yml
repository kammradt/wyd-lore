  title_en: Chaos Points
  summary_en: Describes the Chaos Points (CP) PK system ranging from -75 to +75, how killing players lowers CP, how leveling and the Pergaminho do Perdão raise it, the /cp command, and exceptions such as guild wars and city PK areas.
