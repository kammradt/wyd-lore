systems/kingdoms:
  title: Sistema de Reinos
  title_en: Kingdom System
  summary_en: Explains the lore of the split into the kingdoms Hekalotia and Akelonia, how to join one from level 220 by paying the King in Safira, leaving a kingdom for 16 Safiras, and the capes and PK experience benefits of membership.
