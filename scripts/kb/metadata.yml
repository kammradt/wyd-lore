  title_en: Mounts
  summary_en: Explains how mounts grow from egg to foal to mount, how Amagos raise mount level up to 120, the bonuses mounts give (speed, damage, evasion, absorption) and the need to feed them; Grifo Sangrento eggs are for Celestial characters only.
  tags:
  - mounts
  - pets
  - equipment
  - amagos
systems/evasion:
  title: Evasão
  title_en: Evasion
  summary_en: Short guide on the evasion attribute, which gives enemy attacks a chance to miss, and how to raise it through dexterity and certain mounts.
