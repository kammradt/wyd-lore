- id: w2pp_openwyd
  name: w2pp-OpenWYD (Jean1dev) - Go rewrite plus legacy C++ W2PP and Release game files
  url: https://github.com/Jean1dev/w2pp-OpenWYD
  kind: emulator-repo
  canon: official
  language: pt-BR (README, docs, Language.txt, item names) + en
  status: active
  trust: 4
  covers: >
    Release/TMsrv/run/Language.txt = server message table, about 547 tab-separated entries (index, key
    like _NN_/_SN_/_DN_, text) in Brazilian Portuguese, including NPC quest dialogue and lore lines: Soldier
    Leader of Azran and the settler army, blessings invoking Sephira's light, a warrior of King Harbalade
    asked to restore the Hekalotia kingdom, "path of eternal life" (Arch/Celestial quests), Orc's Cape
    quest. Release/Common/ItemList.csv = full item list with Portuguese item names (e.g. Elmo_de_Couro,
    Pocao_de_Cura, Chapeu_de_Midas) plus effects. Also SkillData.csv, NPCGener.txt (spawns), npc/ and
    boss/ folders, QuestDiaria.txt, Regions.txt. docs/migration/*.md documents NPC quest handlers (Arch
    256 chain: Coveiro, Jardineiro, Kaizen, Hidra, Elfos; Zakum, Kibita, Amu Mistico/Terra Mistica, Uxmal,
    Sobrevivente).
  notes: >
    GPL-2.0 for code; game data originates from a leaked official server release (Polly's server / W2PP
    decompilation), so data is canonical but not licensed. The README links an unofficial client download
    and warns to scan for malware; do not use it. Language.txt is the best single source of in-game lore
    text found.
  verified: >
    Opened repo page, Release/, Release/Common, Release/TMsrv/run, docs/, docs/client.md and docs/migration/handlers/_MSG_Quest-npcs.md
    via WebFetch; fetched raw Language.txt and ItemList.csv and inspected content and language.
  research_notes: >
    raw.githubusercontent.com/Jean1dev/w2pp-OpenWYD/main/Release/TMsrv/run/Language.txt and raw.githubusercontent.com/Jean1dev/w2pp-OpenWYD/main/Release/Common/ItemList.csv;
    decode as Windows-1252 (accents appear as mojibake if read as UTF-8). GitHub API commits endpoint
    to detect changes. Git clone for the full tree.
