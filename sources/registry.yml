- id: kersef_faq_kb
  name: FAQ WYD Global / WYD Raid Hut (knowledge base 21, feedback.kersef.com)
  url: https://feedback.kersef.com/en/knowledge-bases/21-faq-wyd-global
  kind: official-faq
  canon: official
  language:
  - pt-BR
  - en
  status: active
  trust: 5
  covers: >-
    Raid Hut's official help center (branded "WYD Raid Hut", team page /team/). Knowledge base 21 has
    at least four categories: 18 "Game Guides (EN)" (~47 articles: basic commands, skills usage, party,
    guild, mounts, refining, sieges, class change, beginner's guide, Royal Arena), 19 "Guias do Jogo (PT-BR)"
    (~77-78 articles), and "Doubts and troubleshooting (EN)" and "Duvidas e solucao de problemas (PT-BR)"
    (~8-9 articles each). Lore-bearing articles: Historia (20364-historia: celestial war, kingdoms 400
    years later), Sistema de Reinos (20462: Hekalotia vs Akelonia split over belief), PERSONAGENS E PRIMEIRAS
    IMPRESSOES (20475: class descriptions TransKnight/Foema/BeastMaster/Huntress). Game-system articles:
    Arch (20384), Replation (20455), Skills (20366), Interface (20365), Controles (20393), 9th Skill (59032),
    10th Skill (58873), Guia para novatos (58185), Beginner's Guide (58186), Capas (57768), Fadas (58182),
    Fragmentos da Alma (58184), Montaria (24236), Barra de Mithril (24025), Arena Real (24218), Guerra
    de Reinos (21552), Guild System (67186), Royal Arena EN (58468), Introduction to CM Initiative (20014),
    Basic Commands (20039), Skills Usage (20050), Outras Perguntas Frequentes (64302), Problemas tecnicos
    (64304).
  fetch:
    enabled: true
    driver: listing
    url: >-
      https://feedback.kersef.com/pt-br/knowledge-bases/21-faq-wyd-global/categories/19-guias-do-jogo-pt-br/articles
    pages: 10
    link_selector: h3 a
    link_pattern: "/articles/\\d+"
    baseline_first_run: true
    images: true
  notes: >-
    Answers the brief's question: yes, an English category (18 Game Guides EN) exists besides category
    19, plus troubleshooting categories in both languages. Spelling "Akelonia" (not Akeronia) is used
    here. A search summary called these "fan-maintained", but the portal is branded WYD Raid Hut and linked
    from the official site's support flow, so treat as official. Platform looks like a Hey/UserEcho-style
    helpdesk.
  verified: >-
    Category and article URLs/titles/snippets seen in WebSearch results; direct WebFetch failed (ENOTFOUND
    feedback.kersef.com). Article counts come from search snippets and differ slightly between pages.
