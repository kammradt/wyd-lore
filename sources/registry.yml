# Registry of known sources about With Your Destiny.
#
# Every source the knowledge base uses or could use, ranked by trust (5 = official primary
# source, 1 = speculation). `canon` is the label pages built from it must carry.
# `fetch` tells scripts/pipeline/fetch.rb how to collect it; sources without an enabled
# `fetch` are tracked for reference and for the discovery job to revisit.
#
# Research done on 2026-10-13 from web search results. Most sites could not be opened from
# the research environment, so `verified` says what was actually checked. The first
# pipeline run in GitHub Actions is the real test of each fetch config.
#
# Game files (client text, item lists) belong to JoyImpact/HanbitSoft: cite them and quote
# short excerpts in wiki pages, but do not copy whole files into this repository.
updated: '2026-10-13'
sources:
