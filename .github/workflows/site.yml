# Builds the wiki site with MkDocs Material and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths: ['wiki/**', 'sources/**/images/**', 'site/**', 'scripts/site/**', 'scripts/kb/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['wiki/**', 'site/**', 'scripts/site/**', 'scripts/kb/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - name: Check knowledge base
        run: ruby scripts/kb/check.rb
      - name: Build site
        run: ruby scripts/site/build.rb --build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/site/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
